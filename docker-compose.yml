services:
  postgres:
    image: postgres:17-alpine
    container_name: helpdesk-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      # รหัสผ่านอ่านจาก ENV (ไม่ hardcode ใน repo) — ตั้งค่าใน shell หรือไฟล์ .env (untracked)
      # เช่น: $env:POSTGRES_PASSWORD="..." ; docker compose up -d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running docker compose up}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
