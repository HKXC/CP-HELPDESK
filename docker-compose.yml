services:
  postgres:
    image: postgres:17-alpine
    container_name: helpdesk-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: [redacted]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
